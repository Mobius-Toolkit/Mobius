name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # Each job hashes a different set of files, so each job saves its own Go cache.
          cache-dependency-path: |
            go.mod
            go.sum

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          install-only: true

      - run: .mobius/check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # Each job hashes a different set of files, so each job saves its own Go cache.
          cache-dependency-path: |
            go.sum
            web/embed.go

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "key=playwright-$RUNNER_OS-$ImageOS-$ImageVersion-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.playwright.outputs.key }}
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: sudo dpkg -i "$HOME"/.cache/playwright-debs/*.deb

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p "$HOME/.cache/playwright-debs/partial"
          printf 'Dir::Cache::Archives "%s/.cache/playwright-debs";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99playwright-debs

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 12

      # apt creates the lock file in the archive directory with no read access for other users.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$HOME/.cache/playwright-debs"

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.playwright.outputs.key }}
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs

      - run: pnpm e2e
        env:
          MOBIUS_E2E_PORT: 6464

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: web/screenshots
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: web/test-results
