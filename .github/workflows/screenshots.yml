name: Screenshots

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      pull-requests: write
    concurrency:
      group: screenshots-comment-pr-${{ github.event.pull_request.number }}
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          gh api --method POST "repos/$REPO/check-runs" -f name=Screenshots -f head_sha="$SHA" -f status=in_progress \
            -f 'output[title]=The screenshots are pending.' \
            -f "output[summary]=See [pull request #$PR](https://github.com/$REPO/pull/$PR)." --silent
          set_section() {
            gh api "repos/$REPO/pulls/$PR" > pr.json
            printf '%s' "$1" > section.txt
            python3 -I - <<'PY' > payload.json
          import json, os, sys
          start = '<!-- screenshots -->'
          end = '<!-- /screenshots -->'
          limit = 65000
          with open('pr.json') as f:
              old = json.load(f)['body'] or ''
          with open('section.txt') as f:
              lines = f.read().rstrip('\n').split('\n')
          table = lines[0].startswith('|')
          head = lines[:2] if table else lines
          rows = lines[2:] if table else []

          def render(tail):
              section = start + '\n### UI screenshots\n\n' + '\n'.join(head + rows + tail) + '\n' + end
              j = old.find(end)
              i = old.rfind(start, 0, j) if j >= 0 else -1
              if i >= 0:
                  return old[:i] + section + old[j + len(end):]
              if old:
                  return old + ('\n' if old.endswith('\n') else '\n\n') + section
              return section

          body = render([])
          hidden = 0
          while len(body) > limit and rows:
              rows.pop()
              hidden += 1
              folder = 'https://github.com/' + os.environ['REPO'] + '/tree/screenshots/pr-' + os.environ['PR']
              body = render(['', 'Screens that the table does not show: ' + str(hidden) + '. See the [folder](' + folder + ').'])
          json.dump({'body': body}, sys.stdout)
          PY
            gh api --method PATCH "repos/$REPO/pulls/$PR" --input payload.json --silent
          }
          set_section "The screenshots are pending. See the [checks of the commit](https://github.com/$REPO/commit/$SHA/checks)."
          if [ -n "$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[] | select(.name == "screenshots") | .name')" ]; then
            gh api --method DELETE "repos/$REPO/issues/$PR/labels/screenshots" --silent
          fi

  publish:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
    concurrency:
      group: screenshots-pr-${{ github.event.workflow_run.pull_requests[0].number }}
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    # This job has a write token and has no checkout. It uses only the PNG files of the artifact.
    steps:
      - run: |
          cat > "$RUNNER_TEMP/complete_check.sh" <<'SH'
          complete_check() {
            local id
            id=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Screenshots" --jq '[.check_runs[].id] | max // empty')
            if [ -n "$id" ]; then
              gh api --method PATCH "repos/$REPO/check-runs/$id" -f status=completed -f conclusion="$1" -f "output[title]=$2" \
                -f "output[summary]=See [pull request #$PR](https://github.com/$REPO/pull/$PR)." --silent
            else
              gh api --method POST "repos/$REPO/check-runs" -f name=Screenshots -f head_sha="$SHA" -f status=completed -f conclusion="$1" -f "output[title]=$2" \
                -f "output[summary]=See [pull request #$PR](https://github.com/$REPO/pull/$PR)." --silent
            fi
          }
          SH
      - run: |
          shopt -s nullglob
          set_section() {
            gh api "repos/$REPO/pulls/$PR" > pr.json
            printf '%s' "$1" > section.txt
            python3 -I - <<'PY' > payload.json
          import json, os, sys
          start = '<!-- screenshots -->'
          end = '<!-- /screenshots -->'
          limit = 65000
          with open('pr.json') as f:
              old = json.load(f)['body'] or ''
          with open('section.txt') as f:
              lines = f.read().rstrip('\n').split('\n')
          table = lines[0].startswith('|')
          head = lines[:2] if table else lines
          rows = lines[2:] if table else []

          def render(tail):
              section = start + '\n### UI screenshots\n\n' + '\n'.join(head + rows + tail) + '\n' + end
              j = old.find(end)
              i = old.rfind(start, 0, j) if j >= 0 else -1
              if i >= 0:
                  return old[:i] + section + old[j + len(end):]
              if old:
                  return old + ('\n' if old.endswith('\n') else '\n\n') + section
              return section

          body = render([])
          hidden = 0
          while len(body) > limit and rows:
              rows.pop()
              hidden += 1
              folder = 'https://github.com/' + os.environ['REPO'] + '/tree/screenshots/pr-' + os.environ['PR']
              body = render(['', 'Screens that the table does not show: ' + str(hidden) + '. See the [folder](' + folder + ').'])
          json.dump({'body': body}, sys.stdout)
          PY
            gh api --method PATCH "repos/$REPO/pulls/$PR" --input payload.json --silent
          }

          set_label() {
            local present
            present=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[] | select(.name == "screenshots") | .name')
            if [ "$1" = on ] && [ -z "$present" ]; then
              gh api --method POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=screenshots' --silent
            elif [ "$1" = off ] && [ -n "$present" ]; then
              gh api --method DELETE "repos/$REPO/issues/$PR/labels/screenshots" --silent
            fi
          }

          source "$RUNNER_TEMP/complete_check.sh"

          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" != "$SHA" ]; then
            exit 0
          fi
          if [ "$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "screenshots")] | length')" -eq 0 ]; then
            set_section "The screenshots failed. See the [run]($RUN_URL)."
            set_label off
            complete_check neutral "The screenshots failed"
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$REPO" --name screenshots --dir shots

          work=$(mktemp -d)
          git -C "$work" init -q -b screenshots
          git -C "$work" config user.name 'github-actions[bot]'
          git -C "$work" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$work" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          for _ in 1 2 3 4 5; do
            if git -C "$work" fetch -q origin screenshots; then
              git -C "$work" reset -q --hard FETCH_HEAD
            fi
            rm -rf "${work:?}/pr-$PR"
            mkdir "$work/pr-$PR"
            for file in shots/*.png; do
              name=${file##*/}
              if [[ $name =~ ^[a-z0-9-]+\.png$ ]]; then
                cp "$file" "$work/pr-$PR/$name"
              fi
            done
            git -C "$work" add -A
            if ! git -C "$work" diff --cached --quiet; then
              git -C "$work" commit -q -m "chore: update the screenshots of pr-$PR"
            fi
            if git -C "$work" push -q origin screenshots; then
              pushed=true
              break
            fi
          done
          if [ "${pushed:-}" != true ]; then
            echo "Cannot push the branch screenshots" >&2
            exit 1
          fi

          base="https://raw.githubusercontent.com/$REPO/$(git -C "$work" rev-parse HEAD)"
          cell() {
            if [ -e "$work/$1/$2" ]; then
              echo "<img width=\"300\" src=\"$base/$1/$2\">"
            else
              echo "none"
            fi
          }
          rows=
          names=$(for file in "$work/main"/*.png "$work/pr-$PR"/*.png; do echo "${file##*/}"; done | sort -u)
          for name in $names; do
            if [ ! -e "$work/main/$name" ]; then
              state=added
            elif [ ! -e "$work/pr-$PR/$name" ]; then
              state=removed
            elif cmp -s "$work/main/$name" "$work/pr-$PR/$name"; then
              continue
            else
              state=changed
            fi
            rows+="| \`${name%.png}\` | $state | $(cell main "$name") | $(cell "pr-$PR" "$name") |"$'\n'
          done
          if [ -z "$rows" ]; then
            set_section "No screen changed."
            set_label off
            complete_check success "No screen changed."
          else
            set_section $'| Screen | State | main | This pull request |\n|---|---|---|---|\n'"$rows"
            set_label on
            complete_check neutral "Screens changed"
          fi
      - if: failure() || cancelled()
        run: |
          source "$RUNNER_TEMP/complete_check.sh"
          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" != "$SHA" ]; then
            exit 0
          fi
          complete_check neutral "The screenshots failed"

  main:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Release'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: screenshots-main
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - run: |
          shopt -s nullglob
          if [ "$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "screenshots")] | length')" -eq 0 ]; then
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$REPO" --name screenshots --dir shots

          work=$(mktemp -d)
          git -C "$work" init -q -b screenshots
          git -C "$work" config user.name 'github-actions[bot]'
          git -C "$work" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$work" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          for _ in 1 2 3 4 5; do
            if git -C "$work" fetch -q origin screenshots; then
              git -C "$work" reset -q --hard FETCH_HEAD
            fi
            rm -rf "$work/main"
            mkdir "$work/main"
            for file in shots/*.png; do
              name=${file##*/}
              if [[ $name =~ ^[a-z0-9-]+\.png$ ]]; then
                cp "$file" "$work/main/$name"
              fi
            done
            git -C "$work" add -A
            if ! git -C "$work" diff --cached --quiet; then
              git -C "$work" commit -q -m "chore: update the screenshots of main"
            fi
            if git -C "$work" push -q origin screenshots; then
              exit 0
            fi
          done
          echo "Cannot push the branch screenshots" >&2
          exit 1
