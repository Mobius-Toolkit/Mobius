name: Screenshots

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: screenshots-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - run: .github/scripts/screenshots.sh pending
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

  publish:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: screenshots-pr-${{ github.event.workflow_run.pull_requests[0].number }}
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHOTS: shots
    steps:
      # A workflow_run job has a write token. Check out only the default branch, never the pull request.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: gate
        run: .github/scripts/screenshots.sh gate-pr

      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.gate.outputs.proceed == 'true'
        run: .github/scripts/screenshots.sh publish

  main:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Release'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: screenshots-main
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHOTS: shots
    steps:
      # A workflow_run job has a write token. Check out only the default branch.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: gate
        run: .github/scripts/screenshots.sh gate-main

      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.gate.outputs.proceed == 'true'
        run: .github/scripts/screenshots.sh main
