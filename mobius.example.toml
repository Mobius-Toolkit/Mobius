# Mobius infrastructure configuration. Domain configuration
# (organizations, repositories, projects, agents, model profiles, harnesses)
# lives in SQLite — manage it through the REST API or the UI.

[server]
bind = "127.0.0.1:8787"
data_dir = "./.mobius-data"
# Serve the built Dioxus UI (`dx build --release --debug-symbols false` in crates/mobius-ui writes
# target/dx/mobius-ui/release/web/public).
ui_dir = "./target/dx/mobius-ui/release/web/public"
log = "info,mobius=debug"

[github]
# GitHub ingestion uses the `gh` CLI (authenticated via `gh auth login`,
# never a token in this file).
poll_interval_secs = 300
gh_binary = "gh"

# [cli]
# Directory containing the `mobius` CLI binary, prepended to harness PATH
# so agents can call back (`mobius task create`, `mobius memory add`, …).
# Default: the directory of the running mobius-server binary — the release
# layout produced by scripts/mobius.sh works out of the box.
# bin_dir = "./target/release"
