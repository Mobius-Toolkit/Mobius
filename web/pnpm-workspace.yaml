  - "@orval/hono@8.47.0"
  - "@orval/mcp@8.47.0"
  - "@orval/mock@8.47.0"
  - "@orval/pinia-colada@8.47.0"
  - "@orval/query@8.47.0"
  - "@orval/solid-start@8.47.0"
  - "@orval/swr@8.47.0"
  - "@orval/valibot@8.47.0"
  - "@orval/zod@8.47.0"
  - orval@8.47.0
