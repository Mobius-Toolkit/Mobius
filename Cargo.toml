[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mobius-core = { path = "crates/mobius-core" }
mobius-api = { path = "crates/mobius-api" }
mobius-store = { path = "crates/mobius-store" }
mobius-harness = { path = "crates/mobius-harness" }
mobius-ingest = { path = "crates/mobius-ingest" }
mobius-ingest-github = { path = "crates/mobius-ingest-github" }
mobius-orchestrator = { path = "crates/mobius-orchestrator" }
mobius-server = { path = "crates/mobius-server" }
mobius-ui = { path = "crates/mobius-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
futures = "0.3"
tracing = "0.1"

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
agent-client-protocol = "2.2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
tempfile = "3"

dioxus = { version = "0.7.10", features = ["web"] }
gloo-net = "0.6"
web-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "allow"
